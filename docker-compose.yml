services:
  tvc:
    build: .
    image: televideoconverter:latest
    container_name: televideoconverter
    env_file: .env
    environment:
      LISTEN_ADDR: ":3000"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 256
    mem_limit: 1536m
    stop_grace_period: 30s
    volumes:
      - ./storage:/storage
      - ./db:/db
      - ./cookies:/cookies
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      common:
        # Nginx Proxy Manager forwards televideo.cnr.pw to this name.
        aliases: [televideoconverter-web-frontend-1]
    restart: unless-stopped

networks:
  common:
    external: true
